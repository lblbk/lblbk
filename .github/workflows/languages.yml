name: Generate Language Stats

on:
  schedule:
    - cron: "0 0 * * *" # 每天更新一次
  workflow_dispatch: # 允许手动触发
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Generate Languages Card
        uses: lowlighter/metrics@latest
        with:
          filename: top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""                        # 清空基础数据，只留语言统计
          config_transparent: yes         # 透明背景
          config_timezone: Asia/Shanghai
          
          # --- 核心修复区 ---
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot  # 忽略没有意义的语言
          plugin_languages_indepth: yes     # 深度扫描：真正去克隆你的仓库分析代码行数
          plugin_languages_sections: most-used, recently-used # 显示最常用和最近使用的
          plugin_languages_details: percentage # 只显示百分比
          plugin_languages_limit: 5
          plugin_languages_analysis_timeout: 15
          
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add top-langs.svg
          git commit -m "Update top languages" || exit 0
          git push
