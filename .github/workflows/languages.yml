name: Generate Language Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Generate Languages Card
        uses: lowlighter/metrics@latest
        with:
          filename: top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""                        
          config_transparent: yes         
          config_timezone: Asia/Shanghai
          
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
          plugin_languages_indepth: yes     
          plugin_languages_sections: most-used   # <--- 这里改成了只有 most-used
          plugin_languages_details: percentage 
          plugin_languages_limit: 5
          plugin_languages_analysis_timeout: 15
          
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add top-langs.svg
          git commit -m "Update top languages" || exit 0
          git push
