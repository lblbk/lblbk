name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *" # 每天更新一次
  workflow_dispatch: # 允许手动触发
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          
          # 核心基础数据（去掉了多余的 community 等模块，保持极简）
          base: header, activity, repositories, metadata
          
          # 模板与透明设置
          template: classic
          config_transparent: yes
          config_timezone: Asia/Shanghai
          
          # --- 语言统计插件 ---
          plugin_languages: yes
          plugin_languages_limit: 5              # 最多显示5种主要语言
          plugin_languages_sections: most-used   # 按使用量排序
          plugin_languages_details: percentage   # 只显示百分比，不显示字节数，保持干净
          plugin_languages_threshold: 2%         # 占比小于2%的（如 HTML/Shell）隐藏，防干扰

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add github-stats.svg
          git commit -m "Update github stats" || exit 0
          git push
